<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Tiwari TV</title>
<link rel="stylesheet" href="css/tv.css">
</head>
<body>
<div id="stage">
  <div id="sky"><div class="glow a"></div><div class="glow b"></div><div id="photo"></div><div class="shade"></div></div>

  <div id="now">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="nepali"></div>
    <div id="weather" class="glass pill"></div>
    <div id="days"></div>
  </div>

  <div id="notes"></div>

  <div id="assistant" class="glass">
    <div class="who"><span class="dot"></span><span class="name">Tiwari TV</span></div>
    <div class="asked"></div>
    <div class="said"></div>
    <div class="recs"></div>
    <div class="hint"></div>
  </div>

  <div id="dock">
    <div id="apps"></div>
  </div>

  <div id="toast" class="glass"></div>
</div>
<script src="config.js"></script>
<script src="js/util.js"></script>
<script src="js/platform.js"></script>
<script src="js/weather.js"></script>
<script src="js/calendar.js"></script>
<script src="js/home.js"></script>
<script src="js/inbox.js"></script>
<script src="js/assistant.js"></script>
<script src="js/main.js"></script>
</body>
</html>
